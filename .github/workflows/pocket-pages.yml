name: Publish SwiDe iPhone editor
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pocket-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xcode-pocket-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      artifact: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - id: bundle
        run: echo "name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Wait for the selected archive to appear in Actions
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT" --jq '[.artifacts[] | select(.expired == false)] | length')
            if [[ "$count" == 1 ]]; then exit 0; fi
            if [[ "$count" != 0 ]]; then echo "Ambiguous Pages artifact"; exit 1; fi
            sleep 5
          done
          echo "Pages artifact did not become available"
          exit 1
      - name: Publish website
        id: publish
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
