name: Build SwiDe for iPhone
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'pocket-editor/**'
      - '.github/workflows/pocket-editor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix "$RUNNER_TEMP/smoke" playwright@1.56.1 --ignore-scripts
      - run: CHROMIUM_PATH="$(command -v google-chrome)" NODE_PATH="$RUNNER_TEMP/smoke/node_modules" node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests
      - run: python3 pocket-editor/bundle.py web "$RUNNER_TEMP/editor.html"
      - run: NODE_PATH="$RUNNER_TEMP/smoke/node_modules" node tests/editor-release-smoke.cjs "$RUNNER_TEMP/editor.html"
  editor:
    needs: interface
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/web-core.test.mjs
      - run: bash pocket-editor/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SwiDe
          path: |
            dist/SwiDe.ipa
            dist/Xcode-Pocket-Editor.ipa
          if-no-files-found: error
  publish:
    needs: editor
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SwiDe
      - name: Publish the installable editor package for SideStore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmp SwiDe.ipa Xcode-Pocket-Editor.ipa
          gh release create "pocket-editor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" SwiDe.ipa Xcode-Pocket-Editor.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "SwiDe 0.5.0 · build $GITHUB_RUN_NUMBER" \
            --notes 'Otevření projektu přímo ze ZIPu nebo složky. Lokální uložení, zavření a opětovné otevření projektu. Stáhni SwiDe.ipa pro SideStore.'
